<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>阅读台</title>
<meta name="description" content="每天 4–6 篇全球好文章的中文深读，攒成写稿、做方案时搜得到、引得了的素材库。">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="阅读台">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
  // 在样式生效前套上读者选的主题和字号，避免闪一下白屏
  try {
    var t = JSON.parse(localStorage.getItem("ydt.theme") || '"auto"'), z = JSON.parse(localStorage.getItem("ydt.size") || '"m"');
    if (t !== "auto") document.documentElement.dataset.theme = t;
    document.documentElement.dataset.size = z;
  } catch (e) {}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/" aria-label="阅读台 首页">
      <img src="icons/mark-64.png" alt="" width="26" height="26">
      <b>阅读台</b>
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="#/" data-tab="today">今日</a>
      <a href="#/library" data-tab="library">素材库</a>
      <a href="#/archive" data-tab="archive">往期</a>
      <a href="#/me" data-tab="me">我的</a>
    </nav>
    <button class="aa" id="aa" type="button" aria-label="阅读设置：主题和字号" aria-haspopup="dialog">Aa</button>
  </div>
</header>
<main id="view" tabindex="-1"><p class="state">正在打开…</p></main>
<nav class="tabs" aria-label="主导航">
  <a href="#/" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h10.5a1 1 0 0 1 1 1V19a1.5 1.5 0 0 0 1.5 1.5H6.5A2.5 2.5 0 0 1 4 18V5.5a1 1 0 0 1 1-1z"/><path d="M16.5 9H19a1 1 0 0 1 1 1v9a1.5 1.5 0 0 1-3 0"/><path d="M7.5 8.5h5.5M7.5 12h5.5M7.5 15.5h3.5"/></svg>今日</a>
  <a href="#/library" data-tab="library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-3.8-6.5 3.8v-16a1 1 0 0 1 1-1z"/></svg>素材库</a>
  <a href="#/archive" data-tab="archive"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15.5" rx="2.5"/><path d="M4 10h16M8.5 3v4M15.5 3v4"/></svg>往期</a>
  <a href="#/me" data-tab="me"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.8 20.5c.9-3.7 3.7-5.8 7.2-5.8s6.3 2.1 7.2 5.8"/></svg>我的</a>
</nav>
<div class="sheet" id="sheet" hidden>
  <div class="scrim" data-close></div>
  <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle">阅读设置</h2><button type="button" class="done" data-close>完成</button></div>
    <div id="sheetBody"></div>
  </section>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="app.js"></script>
</body>
</html>
